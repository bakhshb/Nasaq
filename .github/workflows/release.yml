name: Release

# Manual fallback for publishing an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to package.json version on main)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and checkout release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          git checkout "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python engine
        shell: bash
        run: |
          cd python
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
