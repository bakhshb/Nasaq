name: Release

# Triggered automatically after tag-release.yml creates v* on main merge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python engine
        shell: bash
        run: |
          cd python
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
