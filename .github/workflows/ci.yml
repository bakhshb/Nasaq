name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python package
        run: |
          cd python
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: |
          cd python
          python -m pytest -q

  build-and-smoke:
    name: Build app and engine
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python engine deps
        run: |
          cd python
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and build web + Electron
        run: npm run build

      - name: Build PyInstaller engine
        run: npm run build:python-engine

      - name: Smoke test engine RPC
        run: npm run test:engine

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [python-tests, build-and-smoke]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python engine
        shell: bash
        run: |
          cd python
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nasaq-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Upload Windows unpacked (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Nasaq-Windows-unpacked
          path: release/win-unpacked/
          if-no-files-found: warn
