name: Tag release

on:
  push:
    branches: [main]
    paths-ignore:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create version tag from package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      should_release: ${{ steps.tag.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, bump if needed, tag, and push
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          bump_patch() {
            node -e "
              const parts = process.argv[1].split('.').map(Number);
              parts[2] += 1;
              console.log(parts.join('.'));
            " "$1"
          }

          tag_exists() {
            git rev-parse "$1" >/dev/null 2>&1
          }

          tag_sha() {
            git rev-list -n 1 "$1"
          }

          update_package_version() {
            node -e "
              const fs = require('fs');
              const version = process.argv[1];
              for (const file of ['package.json', 'package-lock.json']) {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                data.version = version;
                if (file === 'package-lock.json' && data.packages && data.packages['']) {
                  data.packages[''].version = version;
                }
                fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
              }
            " "$1"
          }

          HEAD_SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./package.json').version")

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid semver in package.json: ${VERSION}"
            exit 1
          fi

          while tag_exists "v${VERSION}"; do
            EXISTING_SHA=$(tag_sha "v${VERSION}")
            if [ "$EXISTING_SHA" = "$HEAD_SHA" ]; then
              if gh release view "v${VERSION}" >/dev/null 2>&1; then
                echo "Release v${VERSION} already published at HEAD."
                echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag v${VERSION} exists at HEAD without release — will publish."
              break
            fi
            echo "Tag v${VERSION} points to ${EXISTING_SHA:0:7}, HEAD is ${HEAD_SHA:0:7} — bumping patch."
            VERSION=$(bump_patch "$VERSION")
          done

          ORIGINAL=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$ORIGINAL" ]; then
            update_package_version "$VERSION"
            git add package.json package-lock.json
            git commit -m "Release v${VERSION}"
            HEAD_SHA=$(git rev-parse HEAD)
          fi

          TAG="v${VERSION}"
          if ! tag_exists "$TAG"; then
            git tag -a "$TAG" -m "Release ${TAG}"
          fi

          git push origin HEAD:main
          git push origin "$TAG"
          echo "Prepared ${TAG} at ${HEAD_SHA:0:7}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No GitHub release for ${TAG} — will publish."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    name: Publish Windows release
    needs: create-tag
    if: needs.create-tag.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python engine
        shell: bash
        run: |
          cd python
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
